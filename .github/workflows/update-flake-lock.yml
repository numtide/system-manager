name: update-flake-lock
on:
  workflow_dispatch:
  schedule:
    - cron: "45 3 * * 1" # runs weekly every Monday at 03:45 UTC

jobs:
  lockfile:
    runs-on: "ubuntu-latest"
    # The App token carries the write access, so the job token needs none.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        branch:
          - main
          - release-26.05
    steps:
      - name: "Generate a token for the system-manager-flake-updater App"
        id: "app-token"
        uses: "actions/create-github-app-token@v3"
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: "Checkout the repo"
        uses: "actions/checkout@v7"
        with:
          ref: ${{ matrix.branch }}
          token: ${{ steps.app-token.outputs.token }}
      - name: "Install the Nix package manager"
        uses: "NixOS/nix-installer-action@main"
      - name: "Update the lockfiles"
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          nix flake update --commit-lock-file
          nix flake update --commit-lock-file --flake ./testFlake

          cargo update
          git add Cargo.lock
          # Commit exits with an error when there is nothing to do
          git commit -m "cargo update" || true
      - name: "Create Pull Request"
        uses: "peter-evans/create-pull-request@v8"
        with:
          token: ${{ steps.app-token.outputs.token }}
          base: ${{ matrix.branch }}
          branch: "auto_update_deps-${{ matrix.branch }}"
          title: "[${{ matrix.branch }}] Bump flake.lock, testFlake/flake.lock, and Cargo.lock"
          body: |
            Automatically bumped the lock files.
